version: '3.8'

services:
  demo-store:
    build:
      context: ..
      dockerfile: container/Dockerfile
    user: qafind
    entrypoint: ["bun", "./examples/demo-store/server.ts"]
    ports:
      - "3900:3900"
    networks:
      - qafind-isolated-net

  qafind-runner:
    build:
      context: ..
      dockerfile: container/Dockerfile
    depends_on:
      - demo-store
    environment:
      - BASE_URL=http://demo-store:3900
      - QAFIND_PROXY_PORT=8899
      # Set to 1 to apply the default-deny egress firewall and route the sandbox user's
      # traffic through the QAFind proxy (HTTP only; CONNECT denied unless listed in
      # QAFIND_CONNECT_ALLOW_HOSTS). Off by default: the `run` command forwards browser
      # requests from its own process, which the firewall would reject. See README
      # "Request policy limits".
      - QAFIND_EGRESS_FIREWALL=0
      - QAFIND_CONNECT_ALLOW_HOSTS=
    cap_add:
      - NET_ADMIN
    ports:
      - "4100:4100"
    networks:
      - qafind-isolated-net
    command: ["run", "--url", "http://demo-store:3900"]

networks:
  qafind-isolated-net:
    driver: bridge

