name: QAFind
description: Run QAFind against a pull-request commit and upload a signed report with failure screenshots.
author: QAFind
branding:
  icon: shield
  color: blue

inputs:
  api-key:
    description: QAFIND_API_KEY for the QAFind Cloud workspace (store it as a repository secret).
    required: true
  suites:
    description: Comma-separated QAFind suites.
    required: false
    default: smoke,explore
  gate:
    description: Gate mode passed to `qafind --gate`.
    required: false
    default: strict
  report-dir:
    description: Directory for the Markdown report and screenshots.
    required: false
    default: qa-report
  comment:
    description: Comment the report on pull requests.
    required: false
    default: 'true'

outputs:
  run-id:
    description: The QAFind run id, when the request was accepted.
    value: ${{ steps.qa.outputs.run-id }}
  report-path:
    description: Directory containing report.md and screenshots.
    value: ${{ inputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Install the QAFind CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile

    - name: Prepare the QA request
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/qafind"
        if [ -f "$GITHUB_WORKSPACE/qafind.config.json" ]; then
          # Remove test:explore so the checker runs instead of the repository's own script.
          # Keep every other suite and setting.
          jq 'del(.qa.scripts["test:explore"])' "$GITHUB_WORKSPACE/qafind.config.json" \
            > "$RUNNER_TEMP/qafind/qafind.config.json"
        else
          printf '%s\n' '{"qa":{"healthPath":"/","scripts":{}}}' > "$RUNNER_TEMP/qafind/qafind.config.json"
        fi

    - name: Run QAFind
      id: qa
      shell: bash
      continue-on-error: true
      env:
        QAFIND_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ github.token }}
        QA_REPO: ${{ github.server_url }}/${{ github.repository }}
        QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        QA_BRANCH: ${{ github.head_ref || github.ref_name }}
        QA_SUITES: ${{ inputs.suites }}
        QA_GATE: ${{ inputs.gate }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/qafind"
        bun "${{ github.action_path }}/bin/qafind.ts" qa \
          --repo "$QA_REPO" --sha "$QA_SHA" --branch "$QA_BRANCH" \
          --suites "$QA_SUITES" --gate "$QA_GATE" --wait --json > qa.json
        ID=$(jq -r '.id // empty' qa.json)
        if [ -n "$ID" ]; then
          echo "run-id=$ID" >> "$GITHUB_OUTPUT"
        fi

    - name: Write the report
      if: always()
      shell: bash
      env:
        QAFIND_API_KEY: ${{ inputs.api-key }}
        QA_REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/qafind"
        if [ -s qa.json ]; then
          ID=$(jq -r '.id // empty' qa.json)
          if [ -n "$ID" ]; then
            bun "${{ github.action_path }}/bin/qafind.ts" qa report "$ID" --out "$QA_REPORT_DIR" || true
          fi
        fi

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qafind-report
        path: ${{ runner.temp }}/qafind/${{ inputs.report-dir }}
        if-no-files-found: warn
        retention-days: 14

    - name: Comment on the pull request
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        QA_REPORT_DIR: ${{ inputs.report-dir }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        REPORT="$RUNNER_TEMP/qafind/$QA_REPORT_DIR/report.md"
        if [ -f "$REPORT" ]; then
          {
            printf '%s\n' '<!-- qafind -->'
            printf '\n'
            cat "$REPORT"
            printf '\n'
            printf '%s\n' '_Screenshots are attached to the QAFind artifact in this workflow._'
          } > "$RUNNER_TEMP/qafind/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/qafind/comment.md"
        fi
