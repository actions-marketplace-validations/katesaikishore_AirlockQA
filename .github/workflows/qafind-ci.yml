name: QAFind Browser QA and Run Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Report-only PRs (from the hunt or the report command) do not change code; they do not need browser QA.
    paths-ignore:
      - 'qa-hunt/**'
      - 'qa-reports/**'

jobs:
  qafind:
    name: Browser QA and Signed Run Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build TypeScript
        run: bun run build

      - name: GUI smoke and accessibility (Playwright and axe)
        run: bun run qa:gui

      - name: Start demo store
        run: |
          bun ./examples/demo-store/server.ts > /tmp/qafind-demo-store.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3900/ >/dev/null; then
              echo "Demo store is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Demo store did not start on http://127.0.0.1:3900 within 30s"
          cat /tmp/qafind-demo-store.log
          exit 1

      - name: Provide evidence signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.QAFIND_SIGNING_KEY }}
        run: |
          # Use the repository secret when it is set; otherwise sign with a throwaway key for this job only.
          key="${REPO_SIGNING_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::$key"
          echo "QAFIND_SIGNING_KEY=$key" >> "$GITHUB_ENV"

      - name: Run automated tests
        # One process per test file: browsers started by several files in one process interfere on small runners.
        run: bash scripts/test-isolated.sh

      - name: Run CLI against demo store
        run: bun ./bin/qafind.ts run --url http://127.0.0.1:3900

      - name: Verify signed run evidence
        run: bun ./bin/qafind.ts audit ./.qafind/compliance/latest-attestation.json

      - name: Upload run evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qafind-run-evidence
          path: |
            .qafind/compliance/
            .qafind/dataset/
            artifacts/gui-qa/pr/
          retention-days: 30
          if-no-files-found: warn
