name: AirlockQA Deterministic Compliance & QA Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  airlock-qa:
    name: Zero-Trust Deterministic QA & Cryptographic Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium dependencies
        run: npx playwright install chromium --with-deps

      - name: Start Target Web Application (Demo Store)
        run: |
          bun ./examples/demo-store/server.ts &
          sleep 2

      - name: Run AirlockQA Deterministic Tests with Phantom Egress Firewall
        id: airlock_run
        run: |
          bun ./bin/airlock.ts run --url http://127.0.0.1:3900

      - name: Cryptographically Verify Attestation Bundle
        run: |
          bun ./bin/airlock.ts audit ./.airlock/compliance/latest-attestation.json

      - name: Upload SOC 2 & ISO 27001 Compliance Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airlock-compliance-bundle
          path: |
            .airlock/compliance/
            .airlock/dataset/
          retention-days: 90

      - name: Post PR Compliance & Zero-Leak Badge
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './.airlock/compliance/latest-attestation.json';
            if (fs.existsSync(path)) {
              const bundle = JSON.parse(fs.readFileSync(path, 'utf8'));
              const body = `### 🛡️ AirlockQA Audit Passed
              - **Merkle Root:** \`${bundle.merkleRoot}\`
              - **Zero-Secret Exposure:** Verified (0 leaks)
              - **Deterministic Speed:** ${bundle.summary.durationMs}ms ($0.00 token cost)
              - **SOC 2 Status:** CC6.1 & CC6.6 Compliant`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

